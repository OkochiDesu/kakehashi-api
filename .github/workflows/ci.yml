# GitHub Actions のワークフロー名（Actionsタブに表示される）
name: CI

# push（全ブランチ）と main向けPRで実行
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  # このワークフローがリポジトリに対して持つ権限（最小権限で read のみにする）
  contents: read
  # PRへカバレッジコメントを書き込むために必要
  pull-requests: write

concurrency:
  # 同じrefで古い実行が残っている場合はキャンセルして最新のみ実行
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # マージ可否を決める必須チェック（フォーマット + テスト + JaCoCo生成）
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run formatting check and unit tests
        # フォーマット違反またはテスト失敗でジョブを失敗させる
        run: ./gradlew spotlessCheck test jacocoTestReport --no-daemon

      - name: Upload JaCoCo XML
        # 次ジョブのPRカバレッジコメントで利用する
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          if-no-files-found: warn
          path: build/reports/jacoco/test/jacocoTestReport.xml

  reports:
    # レポート作成・PRコメントを担当（verify成功後のみ実行）
    name: Reports
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        # 複雑度レポート作成ツール（lizard）をインストールするために利用
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install complexity analyzer
        run: python3 -m pip install --user lizard

      - name: Generate complexity report
        # push/PRごとに複雑度レポート（XML/TXT）を生成
        run: |
          mkdir -p build/reports/complexity
          python3 -m lizard src/main/kotlin -X > build/reports/complexity/lizard.xml
          python3 -m lizard src/main/kotlin > build/reports/complexity/lizard.txt

      - name: Download JaCoCo XML
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test

      - name: Comment coverage on pull request
        # PR時のみ、JaCoCoレポートをPRコメントとして自動投稿する
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.2
        with:
          title: Code Coverage Report
          paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true
          min-coverage-overall: 0
          min-coverage-changed-files: 0

      - name: Upload quality reports
        # CI結果の確認用にレポートをArtifactsへ保存する
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          if-no-files-found: warn
          path: |
            build/reports/jacoco/test
            build/reports/complexity
