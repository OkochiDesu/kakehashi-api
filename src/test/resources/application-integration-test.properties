# Testcontainers JDBC URL: DataSource 作成時にコンテナを自動起動する
# @DynamicPropertySource / @ServiceConnection は Spring Boot 4.x で動作不安定なため
# driver-class-name に ContainerDatabaseDriver を指定する方式を採用
# 詳細: docs/troubleshooting/testcontainers-jvmstatic-kotlin.md
spring.datasource.url=jdbc:tc:postgresql:16-alpine:///testdb
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.flyway.enabled=true
