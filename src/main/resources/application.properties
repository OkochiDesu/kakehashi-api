spring.application.name=kakehashi-api

# Datasource (devcontainer: docker-compose の db サービスへ接続)
spring.datasource.url=jdbc:postgresql://db:5432/${POSTGRES_DB:my_database}
spring.datasource.username=${POSTGRES_USER:user}
spring.datasource.password=${POSTGRES_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 認証基盤（UC-A1、APP-ADR-0014）
# Google SSO: idToken 検証（Google JWKS）。GOOGLE_CLIENT_ID は本番環境で必ず設定すること
app.auth.google.jwks-uri=https://www.googleapis.com/oauth2/v3/certs
app.auth.google.issuer=https://accounts.google.com
app.auth.google.client-id=${GOOGLE_CLIENT_ID:}
# カンマ区切りの許可ドメイン一覧（例: example.com,example.co.jp）。
# test/integration-test プロファイルでのみ空文字（ドメイン制限なし）を許容する。
# 本番相当プロファイル（test/integration-test以外）で空のまま起動すると
# AuthStartupValidator（config パッケージ）が起動を失敗させるため、実質的に必須設定である。
app.auth.google.allowed-domains=${GOOGLE_ALLOWED_DOMAINS:}
# 自前JWT発行（HS256）。JWT_SECRET は本番環境で 32byte(256bit) 以上のランダム値に必ず上書きすること。
# 以下のデフォルト値は devcontainer/CI 用の開発専用値であり本番では使用しない。
# 本番相当プロファイル（test/integration-test以外）でこのデフォルト値のまま・32byte未満のまま起動すると
# AuthStartupValidator（config パッケージ）が起動を失敗させる。
app.auth.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-please-override-in-production-min-32bytes}
app.auth.jwt.expiration-seconds=3600
